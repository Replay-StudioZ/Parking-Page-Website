            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 0;
            animation: moveXY 9s ease-in-out infinite;

        .rotator {
            width: 100%;
            height: 100%;
            animation: rotateZ 14s ease-in-out infinite;

        .rotator svg {

            height: 100%;

            `;

            const textEN = `
                <p>This website is currently in a holding state, as our game project within the Roblox ecosystem is in active development.</p>
                <p>All up-to-date information regarding our progress, official announcements, technical updates, and major news will be promptly shared via our Telegram and MAX channels. We use these social media platforms as our primary source of communication.</p>
                <p>Follow our official channels to keep up with the story of the project's creation from the very beginning! Every member matters to us, so come join us and become a part of our story even before the official release!</p>
                <p>For your convenience, links to the channels can be found just below. Thank you all in advance for your support and interest in our work! :D</p>
            `;

            function applyText(isRu) {
                infoBlock.innerHTML = isRu ? textRU : textEN;
            }

            applyText(false);

            const browserIsRu = navigator.language.toLowerCase().startsWith('ru');
            applyText(browserIsRu);

            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    if (data.country_code === 'RU') {
                        applyText(true);
                    } else if (!browserIsRu) {
                        applyText(false)
                    }
                })
                .catch(() => {
                })
        });
    </script>
</body>
</html>
